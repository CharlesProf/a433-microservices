# CI Pipeline untuk branch karsajobs-ui (frontend)
name: CI Frontend Karsajobs UI

# Pipeline akan berjalan otomatis saat ada push ke branch karsajobs-ui
on:
  push:
    branches:
      - karsajobs-ui

jobs:
  # Job 1: Lint Dockerfile
  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v3

      # Install hadolint untuk memeriksa kualitas Dockerfile
      - name: Install hadolint
        run: |
          wget -O hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x hadolint
          sudo mv hadolint /usr/local/bin/

      # Jalankan hadolint terhadap Dockerfile
      - name: Run hadolint
        run: hadolint Dockerfile

  # Job 2: Build dan push Docker image
  build-app-karsajobs-ui:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: lint-dockerfile
    steps:
      - name: Checkout kode
        uses: actions/checkout@v3

      # Login ke Docker Hub menggunakan secret dari GitHub
      - name: Login ke Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build dan push Docker image ke Docker Hub
      - name: Build dan Push image
        run: |
          docker build -t charlesprof/karsajobs-ui:latest .
          docker push charlesprof/karsajobs-ui:latest
