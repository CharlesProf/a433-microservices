# CI Pipeline untuk branch karsajobs (backend)
name: CI Backend Karsajobs

# Pipeline akan berjalan otomatis saat ada push ke branch karsajobs
on:
  push:
    branches:
      - karsajobs

jobs:
  # Job 1: Lint Dockerfile
  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v3

      # Install hadolint untuk memeriksa kualitas Dockerfile
      - name: Install hadolint
        run: |
          wget -O hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x hadolint
          sudo mv hadolint /usr/local/bin/

      # Jalankan hadolint terhadap Dockerfile
      - name: Run hadolint
        run: hadolint Dockerfile

  # Job 2: Test aplikasi backend
  test-app:
    name: Test App
    runs-on: ubuntu-latest
    needs: lint-dockerfile
    steps:
      - name: Checkout kode
        uses: actions/checkout@v3

      # Setup Go environment
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      # Jalankan unit test backend
      - name: Run unit test
        run: go test -v -short --count=1 $(go list ./...)

  # Job 3: Build dan push Docker image
  build-app-karsajobs:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: test-app
    steps:
      - name: Checkout kode
        uses: actions/checkout@v3

      # Login ke Docker Hub menggunakan secret dari GitHub
      - name: Login ke Docker Hub
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      # Build dan push Docker image ke Docker Hub
      - name: Build dan Push image
        run: |
          docker build -t charlesprof/karsajobs:latest .
          docker push charlesprof/karsajobs:latest
